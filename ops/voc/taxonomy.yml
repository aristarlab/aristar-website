# VOC 메일 분류 기준 — 단일 출처
# 이 파일을 바꾸면 서비스 페이지 CTA의 mailto 제목 태그도 함께 확인한다.
# 운영 규칙: .claude/rules/voc/mail-ops.md

version: 1
updated: 2026-11-06
mailbox: support@aristar.io

# 1순위: 제목의 [슬러그] 태그로 사업을 확정한다.
subject_tag:
  pattern: '^\s*\[(?<slug>[a-z0-9-]+)\]'
  source: 서비스 소개 페이지 문의 CTA가 자동으로 넣는다

businesses:
  - slug: esay-memory-eng
    label: 사업/esay-memory-eng
    name: esay memory eng
    stage: 출시 준비 중
    owner_division: IT
    keywords: [단어, 암기, 영어, 복습, 단어장, vocabulary, 학습, 플래시카드, 앱 설치, 안드로이드, 플레이스토어]

  - slug: content-automation
    label: 사업/content-automation
    name: 콘텐츠 자동화
    stage: 사내 운영
    owner_division: 컨텐츠
    keywords: [영상, 콘텐츠 제작, 자동화, 파이프라인, 렌더링, 숏폼, 업로드, 썸네일]

  - slug: algo-trading
    label: 사업/algo-trading
    name: 알고리즘 트레이딩
    stage: 연구 개발
    owner_division: 전략기획
    keywords: [트레이딩, 전략, 백테스트, MT5, MetaTrader, EA, 지표, 매매]

  - slug: unclassified
    label: 사업/미분류
    name: 미분류
    note: 사업 식별 불가. 추측 배정 금지. 사람이 확인한다.

# 2순위: 발신 도메인·수신 별칭 규칙
routes:
  - match: { to: 'support+esay@aristar.io' }
    business: esay-memory-eng
  - match: { to: 'support+content@aristar.io' }
    business: content-automation
  - match: { to: 'support+trading@aristar.io' }
    business: algo-trading
  - match: { from_domain: 'google.com' }
    types: [법무]
    note: Play Console·AdMob 정책 통지. 본문 확인 필요.

# 3순위: 유형 분류 키워드
types:
  - label: 유형/문의
    keywords: [문의, 질문, 어떻게, 가능한가요, 알려주세요]
  - label: 유형/버그
    keywords: [오류, 버그, 안 됩니다, 작동하지, 튕김, 크래시, 멈춤, 에러]
    sla_business_days: 1
  - label: 유형/환불
    keywords: [환불, 결제, 취소, 청구, 영수증]
    sla_business_days: 1
  - label: 유형/제안
    keywords: [제안, 건의, 기능 추가, 개선, 있으면 좋겠]
    sla_business_days: 2
  - label: 유형/제휴
    keywords: [제휴, 협업, 파트너, 광고, 입점, 투자]
    sla_business_days: 3
  - label: 유형/채용
    keywords: [채용, 지원, 이력서, 포트폴리오, 인턴]
    sla_business_days: 3
  - label: 유형/법무
    keywords: [개인정보, 삭제 요청, 열람 요청, 내용증명, 분쟁, 저작권, 상표, 고소, 법적]
    escalate: 즉시
    owner_team: legal-team
    note: 사업 라벨과 무관하게 부여한다. 당일 에스컬레이션.
  - label: 유형/스팸
    keywords: [무료 상담, 대출, 홍보 대행, SEO 보장, 바로 연락]

statuses: [상태/신규, 상태/대응중, 상태/대기, 상태/완료]

# 라벨 부여 규칙
labeling:
  business: 1개 (필수)
  type: 1개 이상 (필수)
  status: 1개 (필수)

# 개인정보 취급
privacy:
  commit_mail_body: false
  commit_sender_identity: false
  reports_are_aggregate_only: true
  inbox_dir: ops/voc/inbox   # .gitignore 처리됨. 원본을 커밋하지 않는다.
  delete_requires_ceo_approval: true
